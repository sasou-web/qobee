name: Release

# Build platform installers every time a tag matching v*.*.* is
# pushed, and attach the resulting binaries to a draft GitHub
# Release. Two parallel jobs:
#
#   * Windows  → MSI + NSIS exe
#   * macOS    → universal .dmg + .app bundle
#
# Both jobs upload their artifacts to the same draft release. The
# maintainer flips the release from draft to public manually.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ./src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Build Tauri bundle
        shell: pwsh
        run: |
          # The Tauri CLI walks subfolders for `tauri.conf.json`, so we
          # must run it from the workspace root (where both `ui/` and
          # `src-tauri/` are subfolders), not from `ui/` (which has no
          # subfolders containing the conf).
          ./ui/node_modules/.bin/tauri.cmd build --bundles msi,nsis

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # In a Cargo workspace the bundle output lives at the
          # workspace root (./target/release/bundle), not under the
          # `src-tauri/` sub-crate. We probe both to be robust to
          # future Tauri / cargo layout changes.
          $candidates = @(
            "target/release/bundle",
            "src-tauri/target/release/bundle"
          )
          foreach ($base in $candidates) {
            if (Test-Path $base) {
              Write-Host "Collecting from $base"
              Get-ChildItem -Path $base -Recurse -Include *.msi, *.exe |
                ForEach-Object { Copy-Item $_.FullName -Destination artifacts -Force }
            }
          }
          $found = Get-ChildItem artifacts -ErrorAction SilentlyContinue
          if (-not $found) {
            Write-Error "No installers found under any of: $($candidates -join ', ')"
            exit 1
          }
          Write-Host "Collected:"
          $found | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qobee-windows-installers
          path: artifacts/*
          if-no-files-found: error

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          generate_release_notes: true

  macos:
    name: macOS bundle (universal)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Both Apple Silicon and Intel architectures so a single .dmg
      # works on every Mac shipped since 2020. Tauri's `--target
      # universal-apple-darwin` flag handles the lipo step for us.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ./src-tauri
          # Separate cache key from the Windows job so the two
          # don't fight over `target/`.
          key: macos

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Build Tauri bundle (universal .dmg + .app)
        run: |
          # Same caveat as the Windows job: invoke the Tauri CLI from
          # the workspace root, not from `ui/`. We restrict the
          # bundle targets so the macOS run doesn't try to build a
          # Windows installer (`msi` would just be skipped on this
          # platform but the explicit list keeps logs clean).
          ./ui/node_modules/.bin/tauri build \
            --target universal-apple-darwin \
            --bundles dmg,app

      - name: Collect bundles
        run: |
          mkdir -p artifacts
          # Tauri lays bundle output under
          # target/<triple>/release/bundle when --target is set.
          BUNDLE_BASE="target/universal-apple-darwin/release/bundle"
          if [ ! -d "$BUNDLE_BASE" ]; then
            echo "::error::No bundle directory at $BUNDLE_BASE"
            exit 1
          fi
          # .dmg lives in $BUNDLE_BASE/dmg/, .app under $BUNDLE_BASE/macos/.
          # We zip the .app so it survives upload (a .app bundle is a
          # directory; uploading a directory would lose its
          # executable bits).
          if compgen -G "$BUNDLE_BASE/dmg/*.dmg" > /dev/null; then
            cp "$BUNDLE_BASE"/dmg/*.dmg artifacts/
          fi
          if compgen -G "$BUNDLE_BASE/macos/*.app" > /dev/null; then
            for app in "$BUNDLE_BASE"/macos/*.app; do
              name="$(basename "$app" .app)"
              ditto -c -k --keepParent "$app" "artifacts/${name}.app.zip"
            done
          fi
          ls -lh artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qobee-macos-bundles
          path: artifacts/*
          if-no-files-found: error

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
          generate_release_notes: true
