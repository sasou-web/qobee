name: Release

# Build platform installers every time a tag matching v*.*.* is
# pushed, sign them for the auto-updater, and attach the resulting
# binaries plus an updater manifest (`latest.json`) to a GitHub
# Release. Two parallel jobs feed the same release:
#
#   * Windows  → MSI + NSIS exe (+ .sig)
#   * macOS    → universal .dmg + .app.tar.gz (+ .sig)
#
# `tauri-apps/tauri-action` handles the bundle build, signs each
# updater artifact with `TAURI_SIGNING_PRIVATE_KEY`, and publishes
# `latest.json` next to the assets. The app's updater endpoint
# (`releases/latest/download/latest.json` in tauri.conf.json) reads
# that manifest, so shipped builds update themselves in place.
#
# Required repository secrets:
#   * TAURI_SIGNING_PRIVATE_KEY           — minisign private key
#                                           (contents of
#                                           src-tauri/.tauri/qobee_updater.key)
#   * TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — its password ("" if the
#                                           key was generated without
#                                           one)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.platform }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles msi,nsis"
            rust-targets: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles dmg,app"
            rust-targets: "x86_64-apple-darwin,aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ./src-tauri
          key: ${{ matrix.platform }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build, sign and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing. The private key + its password are
          # repository secrets; the matching public key is pinned in
          # tauri.conf.json so shipped builds verify what we sign.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The Tauri CLI walks subfolders for `tauri.conf.json`, so
          # the project root (where `ui/` and `src-tauri/` are
          # siblings) is the correct working dir — the action's
          # default.
          tagName: ${{ github.ref_name }}
          releaseName: "Qobee ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Emit `latest.json` next to the assets so the updater
          # endpoint can find it (this is the action's default, set
          # explicitly here for clarity).
          includeUpdaterJson: true
          args: ${{ matrix.args }}
