name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build & check (${{ matrix.os }})
    # Matrix CI catches platform regressions before they reach a
    # release tag. The macOS job validates that the engine still
    # compiles without `wasapi` / `windows` crates, that the Tauri
    # shell falls back to the cross-platform integration stubs, and
    # that the universal bundle target builds.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Pinned to match rust-toolchain.toml so CI and local dev use
        # the same rustfmt / clippy. Bump both together.
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ./src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Frontend type-check
        working-directory: ui
        run: npm run check

      - name: Frontend build
        working-directory: ui
        run: npm run build

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo test
        run: cargo test --workspace
