[package]
name = "qobee-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Audio engine for Qobee: decoding (Symphonia) + output (CPAL Shared, WASAPI Exclusive seam)."

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
rtrb = { workspace = true }
arc-swap = { workspace = true }

symphonia = { workspace = true }
cpal = { workspace = true }
rubato = { workspace = true }
fft-convolver = { workspace = true }
realfft = "3"

# Drive backend used by `SymphoniaDecoder::open_uri` when the
# track path is a `drv://...` URI. The dependency is one-way
# (engine depends on drive, never the reverse); drive only knows
# about the `MediaSource` trait from symphonia, so there's no
# loop.
qobee-drive = { workspace = true }

# WASAPI Exclusive backend (Windows-only). Pulled via target-cfg below.

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.23"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
] }

[features]
default = []
# Reserved seam for a future BASS-based backend. Currently a stub that returns
# `EngineError::BackendUnavailable`; pulling this feature in does not add any
# external dependency yet.
engine-bass = []
# Opt-in flag for the long-running resampler SNR property tests
# (Properties 15 / 16). Off by default because each FFT pass through
# 65 536 samples is a few seconds of CPU; CI only runs them on the
# nightly audio-quality job that explicitly enables this feature.
slow-tests = []

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
tracing-test = { workspace = true }
# FFT helper used by the `Dither_Stage` property tests (Property 3,
# `shaped_f_weighted` spectral bound). See task 17.
realfft = "3"
# Direct rubato access for the resampler SNR tests (Properties
# 15-16). The engine itself depends on rubato as a regular dep, but
# integration tests need an explicit handle on `SincFixedIn`.
rubato = { workspace = true }
