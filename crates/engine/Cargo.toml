[package]
name = "qobee-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Simple audio engine for Qobee: a thin rodio-backed playback core (decode + output + volume + seek) with a CPAL output-device picker."

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }

# High-level playback core. rodio owns decoding (Symphonia), output
# (CPAL), volume, seeking, and source queuing. It also re-exports the
# matching `cpal` (used by `device.rs` for output-device enumeration),
# so we deliberately do NOT depend on `cpal` directly — that would risk
# pulling a second, incompatible cpal version into the graph.
rodio = { workspace = true }

# Drive backend: lets the engine build a rodio `Decoder` over an HTTP
# byte-range `MediaSource` when a track path is a `drv://…` URI. The
# dependency is one-way (engine → drive, never the reverse).
qobee-drive = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
