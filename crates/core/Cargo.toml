# `tokio::sync::broadcast` channel sits next to the legacy
# crossbeam one so the application layer can wire UI / SMTC /
# MPNowPlayingInfoCenter against a single source of truth.
tokio = { workspace = true }

qobee-engine = { workspace = true }
qobee-library = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tracing-test = { workspace = true }
