[package]
name = "qobee-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Orchestration layer for Qobee: queue, player FSM, event bus."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }

qobee-engine = { workspace = true }
qobee-library = { workspace = true }

# Used by `Player::load_convolver_ir` (R9.3) to resample a stereo
# WAV impulse response from its native sample rate to the device
# sample rate before pushing it into the engine's `Convolver_Stage`.
rubato = { workspace = true }

# Used by `crate::diagnostic::run_null_test` (Phase F) to resolve
# the per-user `%APPDATA%/Qobee/diagnostic/` directory where the
# generated test WAV and the captured loopback are written and then
# deleted.
dirs = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tracing-test = { workspace = true }
