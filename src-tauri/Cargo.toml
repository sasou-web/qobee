[package]
name = "qobee-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Qobee desktop app: Tauri 2 shell wiring engine, library and UI."

[lib]
name = "qobee_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = "2.2"
tauri-plugin-window-state = "2.4"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
parking_lot = { workspace = true }
dirs = { workspace = true }
crossbeam-channel = { workspace = true }
discord-rich-presence = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
blake3 = { workspace = true }

qobee-engine = { workspace = true }
qobee-library = { workspace = true }
qobee-core = { workspace = true }
