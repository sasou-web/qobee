[package]
name = "qobee-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Qobee desktop app: Tauri 2 shell wiring engine, library and UI."

[lib]
name = "qobee_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-window-state = "2.4"
tauri-plugin-single-instance = { version = "2.2", features = ["deep-link"] }
tauri-plugin-deep-link = "2.2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
parking_lot = { workspace = true }
dirs = { workspace = true }
crossbeam-channel = { workspace = true }
discord-rich-presence = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
blake3 = { workspace = true }

qobee-engine = { workspace = true }
qobee-library = { workspace = true }
qobee-core = { workspace = true }
lofty = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Used by `commands::get_device_mix_format` to read
# `IAudioClient::GetMixFormat()` directly without spinning up a full
# WASAPI exclusive session. Same pinned version as `qobee-engine`.
wasapi = "0.23"
# Used by the Windows integration module for AppUserModelID,
# autostart registry, and the deep-link / context menu plumbing.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
